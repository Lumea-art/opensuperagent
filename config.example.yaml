instance:
  # Default: ~/.opensuperagent — a user-level dir that does not depend on
  # where the CLI is launched. Override with OPENSUPERAGENT_DATA_ROOT.
  data_root: ~/.opensuperagent
  max_active_tasks: 2

models:
  router: deepseek-flash
  # Worker model comes from secrets/llm.json workerModel (default deepseek-flash)

# Put API key in <data_root>/secrets/llm.json or DEEPSEEK_API_KEY env,
# or configure providers in the web console (stored in <data_root>/secrets/).
# Example <data_root>/secrets/llm.json:
#   { "provider":"deepseek", "baseUrl":"https://api.deepseek.com",
#     "apiKey":"sk-...", "routerModel":"deepseek-flash", "workerModel":"deepseek-flash" }

router:
  instructions: ""

execution:
  exec_timeout_sec: 120
  default_deadline_sec: 1800

supervisor:
  max_turn_duration_sec: 1200
  stall_after_sec: 1800
  interval_sec: 60

console:
  # host:port; use [::1]:7420 for IPv6 loopback
  listen: 127.0.0.1:7420
  # admin_token: set via env OPENSUPERAGENT_ADMIN_TOKEN for non-loopback access

sources:
  - source: console
